<!DOCTYPE html>
<html>

<head>
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <link rel="stylesheet" href="covid-19Page.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
</head>

<body>
    <div class="covid-19-bg-container d-flex flex-column">
        <div class="covid-19-info d-flex flex-row">
            <div class="covid-info-text">
                <h1 class="covid-info-heading">All you need to know about COVID-19</h1>
                <button class="btn btn-primary know-button">Know more</button>
            </div>
            <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/medicalcare-img.png">
            
            
        </div>
        <div class="covid-test-card d-flex flex-row">
            <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/coronavirus-img.png" class="corona-image">
            <div class="corona-test-text">
                <h1 class="corona-test-title">COVID-19 Test</h1>
                <p class="corona-test-description">If you think you have been exposed to novel coromavirus (COVID-19)...more</p>
            </div>
        </div>
        <h1 class="corona-sub-heading">Symptoms</h1>
        <div class="d-flex flex-row">
            <div class="corona-cough-card">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/cough-img.png" class="corona-symptom-image">
                <p class="corona-symptom-card">Dry Cough</p>
            </div>
            <div class="corona-fever-card">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/fever-img.png" class="corona-symptom-image">
                <p class="corona-symptom-card">High Fever</p>
            </div>
            <div class="corona-headache-card">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/headache-img.png" class="corona-symptom-image">
                <p class="corona-symptom-card">Headache</p>
            </div>
        </div>
        <h1 class="corona-sub-heading">Videos</h1>
        <div class="covid-test-video-card d-flex flex-row">
            <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/doctor-img.png" class="corona-image">
            <div class="corona-test-text">
                <h1 class="corona-test-title"> To prevent the spread of ...</h1>
                <p class="corona-test-description">If you think you have been exposed to novel corona virus (COVID-19)</p>
                <button class="btn btn-primary know-button">Watch video</button>
            </div>
        </div>

    </div>
</body>

</html>
